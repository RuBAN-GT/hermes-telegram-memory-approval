name: Native Hermes feasibility probes
on: [push, pull_request, workflow_dispatch]
permissions:
  contents: read
jobs:
  real-native-api:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/checkout@v4
        with:
          repository: NousResearch/hermes-agent
          ref: 8ffb3c655000f57f489a93cd2b32b5b71dc5c2e4
          path: upstream-hermes
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python -m pip install -e '.[test]'
      - run: python -m compileall -q tests
      - run: python -m pytest -q tests --tb=short
        env:
          HERMES_SOURCE: ${{ github.workspace }}/upstream-hermes
